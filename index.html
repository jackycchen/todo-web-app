<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办清单</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // 首帧前应用持久化的主题选择,避免刷新时闪错配色
    (function () {
      try {
        var theme = localStorage.getItem("todo-app.theme");
        if (theme === "dark" || theme === "light") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (err) {
        // localStorage 不可用时静默回退到系统主题
      }
    })();
  </script>
</head>
<body>
  <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切换浅色 / 深色模式" title="切换浅色 / 深色模式">
    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>
  <main class="app">
    <header class="app-header">
      <h1>待办清单</h1>
      <div class="stats-bar" role="status" aria-live="polite">
        <span class="stats-text">
          已完成 <strong id="stats-completed">0</strong> 项 / 共 <strong id="stats-total">0</strong> 项
        </span>
      </div>
    </header>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input
        type="text"
        id="todo-input"
        class="todo-input"
        placeholder="想做点什么?按回车添加"
        maxlength="200"
      >
      <select id="todo-priority" class="todo-priority-select" aria-label="优先级">
        <option value="high">高</option>
        <option value="medium" selected>中</option>
        <option value="low">低</option>
      </select>
      <button type="submit" class="todo-add-btn">添加</button>
    </form>

    <div class="filter-bar">
      <nav class="filters" aria-label="按状态筛选">
        <button type="button" class="filter-btn is-active" data-filter="all">全部</button>
        <button type="button" class="filter-btn" data-filter="active">待完成</button>
        <button type="button" class="filter-btn" data-filter="completed">已完成</button>
      </nav>
      <label class="sort-control">
        <span class="sort-label">排序</span>
        <select id="sort-select" class="sort-select" aria-label="排序方式">
          <option value="created-desc" selected>创建时间 新→旧</option>
          <option value="created-asc">创建时间 旧→新</option>
          <option value="priority-desc">优先级 高→低</option>
          <option value="priority-asc">优先级 低→高</option>
        </select>
      </label>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-state" class="empty-state" hidden>暂无待办,添加一条开始吧 ✨</p>
  </main>

  <script src="todo.js"></script>
</body>
</html>
