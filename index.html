<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办清单</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // 首帧前应用持久化的主题选择,避免刷新时闪错配色
    (function () {
      try {
        var theme = localStorage.getItem("todo-app.theme");
        if (theme === "dark" || theme === "light") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (err) {
        // localStorage 不可用时静默回退到系统主题
      }
    })();
  </script>
</head>
<body>
  <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切换浅色 / 深色模式" title="切换浅色 / 深色模式">
    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>
  <section id="auth-view" class="auth-view" hidden>
    <div class="auth-card">
      <h2 class="auth-title">待办清单</h2>
      <p class="auth-tip">登录后即可在任意浏览器同步你的待办</p>
      <div class="auth-tabs" role="tablist" aria-label="登录 / 注册">
        <button type="button" class="auth-tab is-active" data-auth-tab="login" role="tab" aria-selected="true">登录</button>
        <button type="button" class="auth-tab" data-auth-tab="register" role="tab" aria-selected="false">注册</button>
      </div>

      <form id="login-form" class="auth-form" autocomplete="on">
        <label class="auth-label" for="login-username">用户名</label>
        <input id="login-username" type="text" class="auth-input" placeholder="请输入用户名" autocomplete="username">
        <label class="auth-label" for="login-password">密码</label>
        <input id="login-password" type="password" class="auth-input" placeholder="请输入密码" autocomplete="current-password">
        <button type="submit" class="auth-submit">登录</button>
      </form>

      <form id="register-form" class="auth-form" autocomplete="on" hidden>
        <label class="auth-label" for="register-username">用户名</label>
        <input id="register-username" type="text" class="auth-input" placeholder="设置用户名" autocomplete="username">
        <label class="auth-label" for="register-password">密码</label>
        <input id="register-password" type="password" class="auth-input" placeholder="至少 6 位" autocomplete="new-password">
        <button type="submit" class="auth-submit">注册并登录</button>
      </form>

      <p id="auth-error" class="auth-error" hidden></p>
    </div>
  </section>

  <main id="app-view" class="app" hidden>
    <header class="app-header">
      <h1>待办清单</h1>
      <div class="user-bar">
        <span id="current-user" class="current-user"></span>
        <button type="button" id="logout-btn" class="logout-btn">退出登录</button>
      </div>
      <div class="stats-bar" role="status" aria-live="polite">
        <span class="stats-text">
          已完成 <strong id="stats-completed">0</strong> 项 / 共 <strong id="stats-total">0</strong> 项
        </span>
      </div>
      <p id="sync-notice" class="sync-notice" role="status" aria-live="polite" hidden>
        已在其他设备更新
      </p>
    </header>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input
        type="text"
        id="todo-input"
        class="todo-input"
        placeholder="想做点什么?按回车添加"
        maxlength="200"
      >
      <button type="submit" class="todo-add-btn">添加</button>
    </form>

    <nav class="filters" aria-label="筛选">
      <button type="button" class="filter-btn is-active" data-filter="all">全部</button>
      <button type="button" class="filter-btn" data-filter="active">未完成</button>
      <button type="button" class="filter-btn" data-filter="completed">已完成</button>
      <button
        type="button"
        id="clear-completed"
        class="clear-completed-btn"
        aria-label="清除所有已完成的待办"
        hidden
        disabled
      >清除已完成</button>
    </nav>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-state" class="empty-state" hidden>暂无待办,添加一条开始吧 ✨</p>
  </main>

  <script src="todo-core.js"></script>
  <script src="api.js"></script>
  <script src="todo.js"></script>
</body>
</html>
