<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办清单</title>
  <link rel="stylesheet" href="style.css">
  <!-- 首帧前应用持久化的主题,避免刷新时闪错配色(外置以满足 CSP script-src 'self') -->
  <script src="theme-init.js"></script>
</head>
<body>
  <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切换浅色 / 深色模式" title="切换浅色 / 深色模式">
    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>
  <section id="auth-view" class="auth-view" hidden>
    <div class="auth-card">
      <h2 class="auth-title">待办清单</h2>
      <p class="auth-tip">登录后即可在任意浏览器同步你的待办</p>
      <div class="auth-tabs" role="tablist" aria-label="登录 / 注册">
        <button type="button" class="auth-tab is-active" data-auth-tab="login" role="tab" aria-selected="true">登录</button>
        <button type="button" class="auth-tab" data-auth-tab="register" role="tab" aria-selected="false">注册</button>
      </div>

      <form id="login-form" class="auth-form" autocomplete="on">
        <label class="auth-label" for="login-username">用户名</label>
        <input id="login-username" type="text" class="auth-input" placeholder="请输入用户名" autocomplete="username">
        <label class="auth-label" for="login-password">密码</label>
        <input id="login-password" type="password" class="auth-input" placeholder="请输入密码" autocomplete="current-password">
        <button type="submit" class="auth-submit">登录</button>
      </form>

      <form id="register-form" class="auth-form" autocomplete="on" hidden>
        <label class="auth-label" for="register-username">用户名</label>
        <input id="register-username" type="text" class="auth-input" placeholder="设置用户名" autocomplete="username">
        <label class="auth-label" for="register-password">密码</label>
        <input id="register-password" type="password" class="auth-input" placeholder="至少 12 位" autocomplete="new-password">
        <button type="submit" class="auth-submit">注册并登录</button>
      </form>

      <p id="auth-error" class="auth-error" hidden></p>
    </div>
  </section>

  <main id="app-view" class="app" hidden>
    <header class="app-header">
      <h1>待办清单</h1>
      <div class="user-bar">
        <span id="current-user" class="current-user"></span>
        <button type="button" id="logout-btn" class="logout-btn">退出登录</button>
      </div>
      <div class="stats-bar" role="status" aria-live="polite">
        <span class="stats-text">
          已完成 <strong id="stats-completed">0</strong> 项 / 共 <strong id="stats-total">0</strong> 项
        </span>
      </div>
      <p id="sync-notice" class="sync-notice" role="status" aria-live="polite" hidden>
        已在其他设备更新
      </p>
    </header>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input
        type="text"
        id="todo-input"
        class="todo-input"
        placeholder="想做点什么?按回车添加"
        maxlength="200"
      >
      <button type="submit" class="todo-add-btn">添加</button>
    </form>

    <div class="filter-toolbar">
      <div class="filters" role="tablist" aria-label="筛选待办">
        <button type="button" id="filter-tab-all" class="filter-btn is-active" data-filter="all" role="tab" aria-selected="true" aria-controls="todo-panel" tabindex="0">全部</button>
        <button type="button" id="filter-tab-active" class="filter-btn" data-filter="active" role="tab" aria-selected="false" aria-controls="todo-panel" tabindex="-1">进行中</button>
        <button type="button" id="filter-tab-completed" class="filter-btn" data-filter="completed" role="tab" aria-selected="false" aria-controls="todo-panel" tabindex="-1">已完成</button>
      </div>

      <!-- 排序切换:仅前端视图偏好,不影响服务端顺序与数据结构 -->
      <div id="sort-controls" class="filters sort-controls" role="group" aria-label="按优先级排序">
        <button type="button" id="sort-order-desc" class="filter-btn is-active" data-sort="desc" aria-pressed="true" aria-label="按优先级从高到低排序">高→低</button>
        <button type="button" id="sort-order-asc" class="filter-btn" data-sort="asc" aria-pressed="false" aria-label="按优先级从低到高排序">低→高</button>
      </div>

      <!-- 关键字搜索:与上方三态筛选组合生效,清空后恢复普通列表 -->
      <div class="search-box">
        <label class="visually-hidden" for="todo-search">搜索待办</label>
        <input
          type="search"
          id="todo-search"
          class="search-input"
          placeholder="搜索待办关键字"
          maxlength="200"
          autocomplete="off"
          aria-label="搜索待办"
        >
      </div>

      <div class="list-toolbar">
        <p id="remaining-count" class="remaining-count" role="status" aria-live="polite" aria-atomic="true">
          还剩 <strong id="remaining-count-number">0</strong> 项未完成
        </p>
        <button type="button" id="clear-completed-btn" class="clear-completed-btn" disabled aria-label="清除已完成待办">
          清除已完成
        </button>
      </div>
      <p id="clear-status" class="clear-status" role="status" aria-live="polite" hidden></p>
    </div>

    <div id="todo-panel" class="todo-panel" role="tabpanel" aria-labelledby="filter-tab-all">
      <ul id="todo-list" class="todo-list" aria-label="待办列表"></ul>

      <div id="empty-state" class="empty-state" role="status" aria-live="polite" aria-atomic="true" hidden>
        <svg class="empty-state-illustration" viewBox="0 0 120 120" width="112" height="112" aria-hidden="true" focusable="false">
          <circle class="empty-state-blob" cx="60" cy="60" r="52"></circle>
          <rect class="empty-state-paper" x="36" y="26" width="48" height="68" rx="8"></rect>
          <path class="empty-state-line" d="M47 46h26M47 58h20M47 70h24"></path>
          <path class="empty-state-check" d="M47 86l6 6 13-15"></path>
        </svg>
        <p id="empty-state-title" class="empty-state-title">还没有待办事项</p>
        <p id="empty-state-text" class="empty-state-hint">点击上方输入框,添加你的第一条待办吧 ✨</p>
        <button type="button" id="empty-state-action" class="empty-state-action">添加第一个待办</button>
      </div>

      <div id="list-pagination" class="list-pagination" hidden>
        <p id="list-status" class="list-status" role="status" aria-live="polite"></p>
        <button type="button" id="load-more-btn" class="load-more-btn">加载更多</button>
      </div>
    </div>

    <!-- 删除撤销提示:单例节点,连续删除复用同一个提示并重置计时器 -->
    <div id="undo-toast" class="undo-toast" role="status" aria-live="polite" hidden>
      <span id="undo-toast-text" class="undo-toast-text">已删除 ·</span>
      <button type="button" id="undo-btn" class="undo-btn" aria-label="撤销删除">撤销</button>
    </div>
  </main>

  <script src="todo-core.js"></script>
  <script src="api.js"></script>
  <script src="todo.js"></script>
</body>
</html>
